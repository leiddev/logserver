<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT -->
<!-- Log viewer shared by both web front ends: the layout, the styling and
     everything that renders lines. It is compiled in ahead of a transport
     file (log_page_sse.html or log_page_ws.html), which supplies
     transportName, connect(), disconnect() and isConnected(); log_page_tail.html
     closes the script and the document. html_page.cc concatenates the three
     raw string literals into one page. -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>日志监控</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #title {
            text-align: left;
            font-size: 24px;
            background-color: #f0f0f0;
            padding: 10px 10px 0px 10px;
        }

        #controls {
            padding: 10px;
            background-color: #f0f0f0;
            border-bottom: 1px solid #ccc;
        }

            #controls button {
                margin-right: 10px;
                padding: 8px 15px;
                font-size: 14px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                transition: background-color 0.2s ease, color 0.2s ease;
            }

        .connect-btn {
            background-color: #28a745;
            color: white;
        }

        .disconnect-btn {
            background-color: #dc3545;
            color: white;
        }

        .scroll-on {
            background-color: #007bff;
            color: white;
        }

        .scroll-off {
            background-color: #6c757d;
            color: white;
        }

        #clearLogBtn {
            background-color: #ffc107;
            color: black;
        }

        #saveLogBtn {
            background-color: #17a2b8;
            color: white;
        }

        #log-box {
            flex: 1;
            min-height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            background-color: #f9f9f9;
            font-family: Consolas, "Courier New", monospace;
            white-space: pre-wrap;
        }

        #status {
            font-size: 12px;
            color: #666;
            margin-left: 15px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="title">日志监控<span id="status"></span></div>

        <div id="controls">
            <button id="toggleConnectBtn" class="connect-btn">启动</button>
            <button id="toggleScrollBtn" class="scroll-on">自动滚动</button>
            <button id="clearLogBtn">清空</button>
            <button id="saveLogBtn">保存</button>
        </div>

        <div id="log-box"></div>
    </div>

    <script>
        let autoScroll = true;
        const maxLogLines = 10000;
        const removeBatchSize = 500;   // lines dropped per trim, to keep DOM churn low
        const flushInterval = 50;      // batch flush interval in milliseconds
        const reconnectDelay = 3000;
        let manualClose = false;       // set when the user asked to disconnect
        let retryCount = 0;            // consecutive reconnect attempts

        // Pending lines and the flush timer
        let pendingLogs = [];
        let flushTimer = null;

        /**
         * Queue a line; flushLogs writes the batch to the DOM later.
         */
        function appendLog(message, type = "normal") {
            pendingLogs.push({ message, type });
            if (!flushTimer) {
                flushTimer = setTimeout(flushLogs, flushInterval);
            }
        }

        /**
         * Write the queued lines to the DOM and trim the oldest ones.
         */
        function flushLogs() {
            flushTimer = null;
            if (pendingLogs.length === 0) return;

            const logBox = document.getElementById("log-box");
            const fragment = document.createDocumentFragment();

            for (const item of pendingLogs) {
                const line = document.createElement("div");
                line.textContent = item.message;
                if (item.type === "error") {
                    line.style.color = "red";
                } else if (item.type === "info") {
                    line.style.color = "blue";
                }
                fragment.appendChild(line);
            }
            pendingLogs.length = 0;
            logBox.appendChild(fragment);

            // Trim more than needed at once so trimming runs less often
            if (logBox.children.length > maxLogLines) {
                const toRemove = logBox.children.length - maxLogLines + removeBatchSize;
                for (let i = 0; i < toRemove && logBox.firstChild; i++) {
                    logBox.removeChild(logBox.firstChild);
                }
            }

            // Scroll in requestAnimationFrame to avoid forced synchronous layout
            if (autoScroll) {
                requestAnimationFrame(() => {
                    logBox.scrollTop = logBox.scrollHeight;
                });
            }
        }

        function updateStatus(text) {
            document.getElementById("status").textContent = text;
        }

        function updateConnectButton(connected) {
            const btn = document.getElementById("toggleConnectBtn");
            if (connected) {
                btn.textContent = "停止";
                btn.classList.remove("connect-btn");
                btn.classList.add("disconnect-btn");
            } else {
                btn.textContent = "启动";
                btn.classList.remove("disconnect-btn");
                btn.classList.add("connect-btn");
            }
        }

        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            const btn = document.getElementById("toggleScrollBtn");
            if (autoScroll) {
                btn.textContent = "自动滚动";
                btn.classList.remove("scroll-off");
                btn.classList.add("scroll-on");
            } else {
                btn.textContent = "自动滚动";
                btn.classList.remove("scroll-on");
                btn.classList.add("scroll-off");
            }
        }

        function clearLogBox() {
            // Drop the queue and its timer so a pending flush cannot repopulate the box
            pendingLogs = [];
            if (flushTimer) {
                clearTimeout(flushTimer);
                flushTimer = null;
            }
            document.getElementById("log-box").innerHTML = "";
        }

        function saveLog() {
            // Flush first so the newest lines make it into the export
            if (flushTimer) {
                clearTimeout(flushTimer);
                flushLogs();
            }

            const logBox = document.getElementById("log-box");
            let logContent = logBox.innerText.replace(/\n\s*\n/g, '\n');
            const now = new Date();
            const filename = `log_${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}_`
                + `${String(now.getHours()).padStart(2, '0')}-${String(now.getMinutes()).padStart(2, '0')}-${String(now.getSeconds()).padStart(2, '0')}.txt`;
            const blob = new Blob([logContent], { type: 'text/plain' });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        /**
         * Log a drop and retry the connection, at most three times in a row.
         * A connection the user closed on purpose is never retried, and so is
         * a retry that was already scheduled when the user closed one.
         */
        function scheduleReconnect() {
            if (manualClose) return;
            if (retryCount >= 3) {
                appendLog(transportName + " 重连失败，停止尝试", "error");
                updateStatus("重连失败");
                return;
            }
            retryCount++;
            appendLog(transportName + " 异常断开，" + (reconnectDelay / 1000) + " 秒后尝试重连...", "error");
            updateStatus("重连中...");
            setTimeout(() => {
                if (!manualClose) connect();
            }, reconnectDelay);
        }
