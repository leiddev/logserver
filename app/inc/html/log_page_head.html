<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT -->
<!-- Log viewer shared by both web front ends: the layout, the styling and
     everything that renders lines. It is compiled in ahead of a transport
     file (log_page_sse.html or log_page_ws.html), which supplies
     transportName, connect(), disconnect() and isConnected(); log_page_tail.html
     closes the script and the document. html_page.cc concatenates the three
     raw string literals into one page and fills in __APP_NAME__ and
     __APP_VERSION__ for the about dialog. -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>__APP_NAME__ 日志监控</title>
    <style>
        /* One neutral surface plus a single accent and a single danger colour;
           buttons are told apart by weight, not by a palette of solid colours. */
        :root {
            color-scheme: light;
            --bg: #ffffff;
            --surface: #f6f8fa;
            --border: #d0d7de;
            --hover: #eef1f4;
            --active: #e4e9ee;
            --text: #1f2328;
            --muted: #59636e;
            --accent: #0969da;
            --accent-strong: #0550ae;
            --accent-soft: #ddf4ff;
            --accent-line: #b6e3ff;
            --danger: #cf222e;
            --danger-soft: #ffebe9;
            --ok: #1a7f37;
            --warn: #9a6700;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            color: var(--text);
            background: var(--surface);
            font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px 16px;
            flex-wrap: wrap;
            padding: 10px 16px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }

        #title {
            display: flex;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
        }

        #status {
            display: inline-flex;
            align-items: center;
            margin-left: 12px;
            font-size: 12px;
            font-weight: 400;
            color: var(--muted);
        }

        #status::before {
            content: "";
            width: 8px;
            height: 8px;
            margin-right: 6px;
            border-radius: 50%;
            background: var(--border);
        }

        #status[data-state="ok"]::before   { background: var(--ok); }
        #status[data-state="busy"]::before { background: var(--warn); }
        #status[data-state="err"]::before  { background: var(--danger); }

        #controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            font: inherit;
            font-size: 13px;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        button:hover { background: var(--hover); }
        button:active { background: var(--active); }

        button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        /* Primary action: the only filled button on the page. */
        .connect-btn {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .connect-btn:hover {
            background: var(--accent-strong);
            border-color: var(--accent-strong);
        }

        /* Stopping is destructive, but it is not the primary action. */
        .disconnect-btn {
            border-color: var(--danger);
            color: var(--danger);
        }

        .disconnect-btn:hover {
            background: var(--danger-soft);
            border-color: var(--danger);
        }

        .scroll-on {
            background: var(--accent-soft);
            border-color: var(--accent-line);
            color: var(--accent-strong);
        }

        .scroll-on:hover { background: var(--accent-soft); filter: brightness(0.96); }

        .scroll-off { color: var(--muted); }

        #aboutBtn {
            border-color: transparent;
            color: var(--muted);
        }

        #log-box {
            flex: 1;
            min-height: 300px;
            padding: 12px 16px;
            overflow-y: auto;
            background: var(--bg);
            font-family: Consolas, "SFMono-Regular", "Courier New", monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }

        #log-box:empty::before {
            content: "等待日志…";
            color: var(--muted);
        }

        #log-box .line-info  { color: var(--accent); }
        #log-box .line-error { color: var(--danger); }

        #aboutDialog {
            width: 320px;
            max-width: calc(100% - 32px);
            padding: 20px 24px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg);
            color: var(--text);
            box-shadow: 0 8px 24px rgba(31, 35, 40, 0.15);
        }

        #aboutDialog::backdrop { background: rgba(31, 35, 40, 0.35); }

        #aboutDialog h2 {
            margin: 0;
            font-size: 18px;
        }

        #aboutDialog .tagline {
            margin: 2px 0 16px;
            font-size: 13px;
            color: var(--muted);
        }

        #aboutDialog dl {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 6px 16px;
            margin: 0 0 20px;
            font-size: 13px;
        }

        #aboutDialog dt { color: var(--muted); }
        #aboutDialog dd { margin: 0; }

        #aboutDialog form {
            margin: 0;
            text-align: right;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="bar">
            <div id="title">日志监控<span id="status" data-state="idle">未连接</span></div>

            <div id="controls">
                <button id="toggleConnectBtn" class="connect-btn">启动</button>
                <button id="toggleScrollBtn" class="scroll-on">自动滚动</button>
                <button id="clearLogBtn">清空</button>
                <button id="saveLogBtn">保存</button>
                <button id="aboutBtn">关于</button>
            </div>
        </div>

        <div id="log-box"></div>
    </div>

    <dialog id="aboutDialog">
        <h2>__APP_NAME__</h2>
        <p class="tagline">日志服务器</p>
        <dl>
            <dt>版本</dt><dd>__APP_VERSION__</dd>
            <dt>传输模式</dt><dd id="aboutMode"></dd>
            <dt>版权</dt><dd>&copy; 2023-2026 Leid</dd>
            <dt>许可证</dt><dd>MIT License</dd>
        </dl>
        <form method="dialog"><button>关闭</button></form>
    </dialog>

    <script>
        let autoScroll = true;
        const maxLogLines = 10000;
        const removeBatchSize = 500;   // lines dropped per trim, to keep DOM churn low
        const flushInterval = 50;      // batch flush interval in milliseconds
        const reconnectDelay = 3000;
        let manualClose = false;       // set when the user asked to disconnect
        let retryCount = 0;            // consecutive reconnect attempts

        // Pending lines and the flush timer
        let pendingLogs = [];
        let flushTimer = null;

        /**
         * Queue a line; flushLogs writes the batch to the DOM later.
         */
        function appendLog(message, type = "normal") {
            pendingLogs.push({ message, type });
            if (!flushTimer) {
                flushTimer = setTimeout(flushLogs, flushInterval);
            }
        }

        /**
         * Write the queued lines to the DOM and trim the oldest ones.
         */
        function flushLogs() {
            flushTimer = null;
            if (pendingLogs.length === 0) return;

            const logBox = document.getElementById("log-box");
            const fragment = document.createDocumentFragment();

            for (const item of pendingLogs) {
                const line = document.createElement("div");
                line.textContent = item.message;
                if (item.type === "error") {
                    line.className = "line-error";
                } else if (item.type === "info") {
                    line.className = "line-info";
                }
                fragment.appendChild(line);
            }
            pendingLogs.length = 0;
            logBox.appendChild(fragment);

            // Trim more than needed at once so trimming runs less often
            if (logBox.children.length > maxLogLines) {
                const toRemove = logBox.children.length - maxLogLines + removeBatchSize;
                for (let i = 0; i < toRemove && logBox.firstChild; i++) {
                    logBox.removeChild(logBox.firstChild);
                }
            }

            // Scroll in requestAnimationFrame to avoid forced synchronous layout
            if (autoScroll) {
                requestAnimationFrame(() => {
                    logBox.scrollTop = logBox.scrollHeight;
                });
            }
        }

        // How the state dot in front of the status text is coloured
        const statusStates = {
            "已连接": "ok",
            "连接中...": "busy",
            "重连中...": "busy",
            "连接错误": "err",
            "重连失败": "err"
        };

        function updateStatus(text) {
            const status = document.getElementById("status");
            status.textContent = text;
            status.dataset.state = statusStates[text] || "idle";
        }

        function updateConnectButton(connected) {
            const btn = document.getElementById("toggleConnectBtn");
            if (connected) {
                btn.textContent = "停止";
                btn.classList.remove("connect-btn");
                btn.classList.add("disconnect-btn");
            } else {
                btn.textContent = "启动";
                btn.classList.remove("disconnect-btn");
                btn.classList.add("connect-btn");
            }
        }

        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            const btn = document.getElementById("toggleScrollBtn");
            if (autoScroll) {
                btn.textContent = "自动滚动";
                btn.classList.remove("scroll-off");
                btn.classList.add("scroll-on");
            } else {
                btn.textContent = "自动滚动";
                btn.classList.remove("scroll-on");
                btn.classList.add("scroll-off");
            }
        }

        function clearLogBox() {
            // Drop the queue and its timer so a pending flush cannot repopulate the box
            pendingLogs = [];
            if (flushTimer) {
                clearTimeout(flushTimer);
                flushTimer = null;
            }
            document.getElementById("log-box").innerHTML = "";
        }

        function saveLog() {
            // Flush first so the newest lines make it into the export
            if (flushTimer) {
                clearTimeout(flushTimer);
                flushLogs();
            }

            const logBox = document.getElementById("log-box");
            let logContent = logBox.innerText.replace(/\n\s*\n/g, '\n');
            const now = new Date();
            const filename = `log_${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}_`
                + `${String(now.getHours()).padStart(2, '0')}-${String(now.getMinutes()).padStart(2, '0')}-${String(now.getSeconds()).padStart(2, '0')}.txt`;
            const blob = new Blob([logContent], { type: 'text/plain' });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        /**
         * Log a drop and retry the connection, at most three times in a row.
         * A connection the user closed on purpose is never retried, and so is
         * a retry that was already scheduled when the user closed one.
         */
        function scheduleReconnect() {
            if (manualClose) return;
            if (retryCount >= 3) {
                appendLog(transportName + " 重连失败，停止尝试", "error");
                updateStatus("重连失败");
                return;
            }
            retryCount++;
            appendLog(transportName + " 异常断开，" + (reconnectDelay / 1000) + " 秒后尝试重连...", "error");
            updateStatus("重连中...");
            setTimeout(() => {
                if (!manualClose) connect();
            }, reconnectDelay);
        }
