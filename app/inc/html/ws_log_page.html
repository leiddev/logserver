<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT -->
<!-- WebSocket log viewer: connects to the server on this host, renders
     incoming lines in batches, and can auto scroll, clear or save them. -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>日志监控</title>
    <style>
        /* Make html and body fill the browser window */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        /* Flex layout so the container fills the viewport */
        #container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        /* Title, left aligned */
        #title {
            text-align: left;
            font-size: 24px;
            background-color: #f0f0f0; /* same as the controls background */
            padding: 10px 10px 0px 10px;
        }
        /* Controls bar */
        #controls {
            padding: 10px;
            background-color: #f0f0f0; /* controls background */
            border-bottom: 1px solid #ccc;
        }
            /* Base style shared by every button */
            #controls button {
                margin-right: 10px;
                padding: 8px 15px;
                font-size: 14px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                transition: background-color 0.2s ease, color 0.2s ease;
            }
        /* Connect toggle: green while connected, red while stopped */
        .connect-btn {
            background-color: #28a745; /* green */
            color: white;
        }

        .disconnect-btn {
            background-color: #dc3545; /* red */
            color: white;
        }
        /* Auto scroll toggle: blue while on, grey while off */
        .scroll-on {
            background-color: #007bff; /* blue */
            color: white;
        }

        .scroll-off {
            background-color: #6c757d; /* grey */
            color: white;
        }
        /* Clear and save buttons */
        #clearLogBtn {
            background-color: #ffc107; /* yellow */
            color: black;
        }

        #saveLogBtn {
            background-color: #17a2b8; /* teal */
            color: white;
        }
        /* Log box */
        #log-box {
            flex: 1;
            min-height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            background-color: #f9f9f9;
            font-family: Consolas, "Courier New", monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- Page title -->
        <div id="title">日志监控</div>

        <!-- Controls -->
        <div id="controls">
            <button id="toggleConnectBtn" class="connect-btn">启动</button>
            <button id="toggleScrollBtn" class="scroll-on">自动滚动</button>
            <button id="clearLogBtn">清空</button>
            <button id="saveLogBtn">保存</button>
        </div>

        <!-- Log output area -->
        <div id="log-box"></div>
    </div>

    <script>
        let ws = null;
        // Whether the view follows the newest line
        let autoScroll = true;
        // Upper bound on retained lines
        const maxLogLines = 10000;
        // Lines dropped per trim, to keep DOM churn low
        const removeBatchSize = 500;
        // Batch flush interval in milliseconds
        const flushInterval = 50;
        // Reconnect delay in milliseconds
        const reconnectDelay = 3000;
        // Set when the user asked to disconnect
        let manualClose = false;
        // Consecutive reconnect attempts
        let retryCount = 0;

        // Pending lines and the flush timer
        let pendingLogs = [];
        let flushTimer = null;

        // Pick the WebSocket scheme from the page protocol
        const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        // Host and port of the page, e.g. example.com:8080
        const wsHost = window.location.host;
        // WebSocket endpoint URI
        const wsUrl = `${wsProtocol}${wsHost}`;

        /**
         * Queue a line; flushLogs writes the batch to the DOM later.
         */
        function appendLog(message, type = "normal") {
            pendingLogs.push({ message, type });
            if (!flushTimer) {
                flushTimer = setTimeout(flushLogs, flushInterval);
            }
        }

        /**
         * Write the queued lines to the DOM and trim the oldest ones.
         */
        function flushLogs() {
            flushTimer = null;
            if (pendingLogs.length === 0) return;

            const logBox = document.getElementById("log-box");
            const fragment = document.createDocumentFragment();

            for (const item of pendingLogs) {
                const line = document.createElement("div");
                line.textContent = item.message;
                if (item.type === "error") {
                    line.style.color = "red";
                } else if (item.type === "info") {
                    line.style.color = "blue";
                }
                fragment.appendChild(line);
            }
            pendingLogs.length = 0;
            logBox.appendChild(fragment);

            // Trim more than needed at once so trimming runs less often
            if (logBox.children.length > maxLogLines) {
                const toRemove = logBox.children.length - maxLogLines + removeBatchSize;
                for (let i = 0; i < toRemove && logBox.firstChild; i++) {
                    logBox.removeChild(logBox.firstChild);
                }
            }

            // Scroll in requestAnimationFrame to avoid forced synchronous layout
            if (autoScroll) {
                requestAnimationFrame(() => {
                    logBox.scrollTop = logBox.scrollHeight;
                });
            }
        }

        function connectWebSocket() {
            if (ws && ws.readyState != WebSocket.CLOSED) return;
            manualClose = false;
            appendLog("WebSocket 正在连接 " + wsUrl + " ...", "info");
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                appendLog("WebSocket 连接成功", "info");
                updateConnectButton(true);
                retryCount = 0;
            };

            ws.onmessage = (event) => {
                let logType = "normal";
                if (event.data.toLowerCase().includes("critical") ||
                    event.data.toLowerCase().includes("warning") ||
                    event.data.toLowerCase().includes("error")) {
                    logType = "error";
                }
                appendLog(event.data, logType);
            };

            ws.onerror = (event) => {
                appendLog("WebSocket 发生错误", "error");
            };

            ws.onclose = (event) => {
                // A clean close is reported, otherwise the drop is logged as an error
                if (event.wasClean) {
                    appendLog("WebSocket 连接已经关闭", "info");
                    manualClose = true;
                } else {
                    appendLog(`WebSocket 异常关闭: ${event.code}`, "error");
                }
                updateConnectButton(false);

                if (!manualClose) {
                    // Try to reconnect
                    if (retryCount < 3) {
                        retryCount++;
                        appendLog("WebSocket 异常断开，" + (reconnectDelay / 1000) + " 秒后尝试重连...", "error");
                        setTimeout(connectWebSocket, reconnectDelay);
                    } else {
                        appendLog("WebSocket 重连失败，停止尝试", "error");
                    }
                }
            };
        }

        function disconnectWebSocket() {
            if (ws) {
                manualClose = true;
                ws.close(1000, 'Normal Closure');
                appendLog("WebSocket 请求关闭连接", "info");
            }
        }

        function updateConnectButton(connected) {
            const btn = document.getElementById("toggleConnectBtn");
            if (connected) {
                btn.textContent = "停止";
                btn.classList.remove("connect-btn");
                btn.classList.add("disconnect-btn");
            } else {
                btn.textContent = "启动";
                btn.classList.remove("disconnect-btn");
                btn.classList.add("connect-btn");
            }
        }

        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            const btn = document.getElementById("toggleScrollBtn");
            if (autoScroll) {
                btn.textContent = "自动滚动";
                btn.classList.remove("scroll-off");
                btn.classList.add("scroll-on");
            } else {
                btn.textContent = "自动滚动";
                btn.classList.remove("scroll-on");
                btn.classList.add("scroll-off");
            }
        }

        function clearLogBox() {
            // Drop the queue and its timer so a pending flush cannot repopulate the box
            pendingLogs = [];
            if (flushTimer) {
                clearTimeout(flushTimer);
                flushTimer = null;
            }
            document.getElementById("log-box").innerHTML = "";
        }

        function saveLog() {
            // Flush first so the newest lines make it into the export
            if (flushTimer) {
                clearTimeout(flushTimer);
                flushLogs();
            }

            const logBox = document.getElementById("log-box");
            let logContent = logBox.innerText.replace(/\n\s*\n/g, '\n');
            const now = new Date();
            const filename = `log_${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}_`
                + `${String(now.getHours()).padStart(2, '0')}-${String(now.getMinutes()).padStart(2, '0')}-${String(now.getSeconds()).padStart(2, '0')}.txt`;
            const blob = new Blob([logContent], { type: 'text/plain' });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        document.getElementById("toggleConnectBtn").addEventListener("click", () => {
            if (ws) {
                if (ws.readyState === WebSocket.OPEN) {
                    disconnectWebSocket();
                } else if (ws.readyState === WebSocket.CLOSED) {
                    retryCount = 0;
                    connectWebSocket();
                }
            } else {
                connectWebSocket();
            }
        });

        document.getElementById("toggleScrollBtn").addEventListener("click", toggleAutoScroll);
        document.getElementById("clearLogBtn").addEventListener("click", clearLogBox);
        document.getElementById("saveLogBtn").addEventListener("click", saveLog);
    </script>
</body>
</html>
